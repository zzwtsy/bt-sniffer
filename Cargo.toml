[package]
name = "bt-sniffer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bendy = {version = "0.6", features = ["serde"]}
rand = "0.10"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "sync", "time", "test-util", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
sha1 = "0.11"
serde_bytes = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_json = "1"
socket2 = "0.6"
directories = "6"
governor = { version = "0.10", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[workspace.lints.rust]
# unsafe fn 内的危险操作仍须显式包在 unsafe 块中
unsafe_op_in_unsafe_fn = "deny"

# 不允许无意忽略 Result 等 #[must_use] 返回值
unused_must_use = "deny"

[workspace.lints.clippy]
# 避免提交调试代码和未完成的实现
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# unsafe 块和 unsafe impl 需要解释安全性的注释
undocumented_unsafe_blocks = "warn"

# 生产代码中的 unwrap 需要重新审视
unwrap_used = "warn"
