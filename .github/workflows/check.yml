name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json
      - name: Install documentation tools
        run: npm ci --prefix tools/docs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Install frontend dependencies and Chromium
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Prepare Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path .agents/skills/rust-async-patterns/examples/Cargo.toml
      - name: Complete offline checks
        env:
          CARGO_NET_OFFLINE: 'true'
        run: python3 scripts/check.py all
      - name: Upload failed check evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: target/checks/
          if-no-files-found: warn
